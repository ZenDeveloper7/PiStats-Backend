name: Bug report
description: Report a reproducible PiStats Backend problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove tokens, passwords, private URLs, SMS content, account identifiers,
        and media paths before submitting logs or configuration.
  - type: input
    id: version
    attributes:
      label: Backend version
      description: Run `apt-cache policy pistats-backend` or provide the commit SHA.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and hardware
      placeholder: Raspberry Pi OS Bookworm, Raspberry Pi 4
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - Signed APT repository
        - Downloaded Debian package
        - Source installer
        - Manual development run
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the HTTP status, safe error code, or Diagnostic ID when available.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted service logs and configuration
      description: Include only relevant `journalctl -u pistats-backend` lines and non-secret settings.
  - type: checkboxes
    id: checks
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, messages, account details, private URLs, and other personal data.
          required: true
