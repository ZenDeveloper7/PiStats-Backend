name: Publish APT repository

on:
  workflow_run:
    workflows: ["Release Debian package"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install --yes apt-utils dpkg-dev gnupg

      - name: Download released Debian packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p incoming
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            gh release download "${tag}" --pattern '*.deb' --dir incoming || true
          done
          test -n "$(find incoming -maxdepth 1 -name '*.deb' -print -quit)"

      - name: Import APT signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          test -n "${APT_GPG_PRIVATE_KEY}"
          printf '%s' "${APT_GPG_PRIVATE_KEY}" | gpg --batch --import
          key_id="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "sec" {print $5; exit}')"
          test -n "${key_id}"
          echo "APT_GPG_KEY_ID=${key_id}" >>"${GITHUB_ENV}"

      - name: Build signed repository
        run: |
          mkdir -p public
          cp privacy-policy.html public/index.html
          cp privacy-policy.html public/privacy-policy.html
          ./packaging/build-apt-repository.sh incoming public/apt stable "${APT_GPG_KEY_ID}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
